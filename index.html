<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="一个轻量、优雅且支持本地保存的 Todo List 待办清单。"
    />
    <meta name="theme-color" content="#f6f5f2" />
    <title>Flowlist · Todo List</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page-glow page-glow--one" aria-hidden="true"></div>
    <div class="page-glow page-glow--two" aria-hidden="true"></div>

    <main class="app-shell">
      <header class="topbar">
        <a class="brand" href="#" aria-label="Flowlist 首页">
          <span class="brand__mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none">
              <path d="m7 12 3 3 7-7" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </span>
          <span>Flowlist</span>
        </a>

        <div class="topbar__actions">
          <p class="today-label" id="today-label"></p>
          <button class="icon-button" id="theme-toggle" type="button" aria-label="切换深浅色模式">
            <svg class="theme-icon theme-icon--sun" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="1.8" />
              <path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.66 6.34l1.41-1.41" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
            </svg>
            <svg class="theme-icon theme-icon--moon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M20.5 14.2A8.2 8.2 0 0 1 9.8 3.5 8.5 8.5 0 1 0 20.5 14.2Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </button>
        </div>
      </header>

      <section class="hero" aria-labelledby="page-title">
        <div class="hero__copy">
          <span class="eyebrow"><span></span> MAKE ROOM FOR WHAT MATTERS</span>
          <h1 id="page-title">把想做的事，<br /><em>一件件完成。</em></h1>
          <p>用清晰的节奏整理每一天，把注意力留给真正重要的事情。</p>
        </div>

        <div class="progress-card" aria-label="任务完成进度">
          <div class="progress-card__top">
            <div>
              <span class="progress-card__label">今日节奏</span>
              <strong id="progress-rate">0%</strong>
            </div>
            <span class="progress-card__ring" id="progress-ring" style="--progress: 0">
              <svg viewBox="0 0 36 36" aria-hidden="true">
                <path class="ring-bg" d="M18 2.5a15.5 15.5 0 1 1 0 31 15.5 15.5 0 1 1 0-31" />
                <path class="ring-value" d="M18 2.5a15.5 15.5 0 1 1 0 31 15.5 15.5 0 1 1 0-31" pathLength="100" />
              </svg>
            </span>
          </div>
          <div class="progress-card__bar" aria-hidden="true">
            <span id="progress-bar"></span>
          </div>
          <div class="stats">
            <div><strong id="total-count">0</strong><span>全部任务</span></div>
            <div><strong id="active-count">0</strong><span>正在进行</span></div>
            <div><strong id="done-count">0</strong><span>已经完成</span></div>
          </div>
        </div>
      </section>

      <section class="workspace" aria-label="Todo List 工作区">
        <form class="quick-add" id="task-form">
          <div class="quick-add__main">
            <span class="quick-add__plus" aria-hidden="true">+</span>
            <label class="sr-only" for="task-input">添加新任务</label>
            <input
              id="task-input"
              name="title"
              type="text"
              maxlength="120"
              autocomplete="off"
              placeholder="接下来要做什么？"
              required
            />
            <button class="add-button" type="submit">
              <span>添加任务</span>
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M5 12h14M14 7l5 5-5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
            </button>
          </div>

          <div class="quick-add__options">
            <label class="field-chip">
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M4 7.5A2.5 2.5 0 0 1 6.5 5h3l2 2h6A2.5 2.5 0 0 1 20 9.5v7a2.5 2.5 0 0 1-2.5 2.5h-11A2.5 2.5 0 0 1 4 16.5v-9Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" />
              </svg>
              <span class="sr-only">分类</span>
              <select id="category-select" name="category" aria-label="任务分类">
                <option value="工作">工作</option>
                <option value="个人">个人</option>
                <option value="学习">学习</option>
                <option value="健康">健康</option>
              </select>
            </label>

            <label class="field-chip">
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M5 21V4m0 1h10.5l-2 3 2 3H5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
              <span class="sr-only">优先级</span>
              <select id="priority-select" name="priority" aria-label="任务优先级">
                <option value="medium">普通优先级</option>
                <option value="high">高优先级</option>
                <option value="low">低优先级</option>
              </select>
            </label>

            <label class="field-chip field-chip--date">
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M7 3v3M17 3v3M4 9h16M6.5 5h11A2.5 2.5 0 0 1 20 7.5v10a2.5 2.5 0 0 1-2.5 2.5h-11A2.5 2.5 0 0 1 4 17.5v-10A2.5 2.5 0 0 1 6.5 5Z" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />
              </svg>
              <span class="sr-only">截止日期</span>
              <input id="due-date-input" name="dueDate" type="date" aria-label="截止日期" />
            </label>
          </div>
        </form>

        <div class="list-panel">
          <div class="list-toolbar">
            <div class="filters" role="tablist" aria-label="筛选任务">
              <button class="filter-button is-active" type="button" data-filter="all" role="tab" aria-selected="true">全部</button>
              <button class="filter-button" type="button" data-filter="today" role="tab" aria-selected="false">今天</button>
              <button class="filter-button" type="button" data-filter="active" role="tab" aria-selected="false">进行中</button>
              <button class="filter-button" type="button" data-filter="completed" role="tab" aria-selected="false">已完成</button>
            </div>

            <label class="search-box">
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <circle cx="11" cy="11" r="6.5" stroke="currentColor" stroke-width="1.8" />
                <path d="m16 16 4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
              </svg>
              <span class="sr-only">搜索任务</span>
              <input id="search-input" type="search" placeholder="搜索任务" autocomplete="off" />
            </label>
          </div>

          <div class="list-heading">
            <div>
              <h2 id="list-title">全部任务</h2>
              <p id="list-summary">0 项任务</p>
            </div>
            <button class="text-button" id="clear-completed" type="button">清除已完成</button>
          </div>

          <ul class="task-list" id="task-list" aria-live="polite"></ul>

          <div class="empty-state" id="empty-state" hidden>
            <span class="empty-state__icon" aria-hidden="true">
              <svg viewBox="0 0 48 48" fill="none">
                <rect x="9" y="7" width="30" height="34" rx="9" stroke="currentColor" stroke-width="2" />
                <path d="M17 18h14M17 25h10M17 32h7" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
              </svg>
            </span>
            <h3 id="empty-title">还没有任务</h3>
            <p id="empty-copy">从一件小事开始，让今天更有条理。</p>
            <button type="button" id="empty-action">添加第一项任务</button>
          </div>
        </div>
      </section>

      <footer class="app-footer">
        <span>Flowlist</span>
        <span>任务保存在当前浏览器中</span>
      </footer>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true">
      <span id="toast-message"></span>
      <button id="toast-action" type="button" hidden>撤销</button>
    </div>

    <script src="app.js" defer></script>
  </body>
</html>
